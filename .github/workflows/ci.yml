name: Clinico CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: clinicos
          POSTGRES_PASSWORD: clinicos_dev
          POSTGRES_DB: clinicos_dev
        options: >-
          --health-cmd "pg_isready -U clinicos -d clinicos_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://clinicos:clinicos_dev@localhost:5432/clinicos_dev
      JWT_SECRET: ci_only_secret_at_least_thirty_two_characters
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Type check
        run: pnpm type-check
      - name: Build applications
        run: pnpm build
